# 生成AIによる記事まとめの自動更新
name: Update AI Summary Article

on:
  schedule:
    # 毎日日本時間8時（UTC 23時前日）に実行
    - cron: '0 23 * * *'
  workflow_dispatch:  # 手動実行も可能

permissions:
  contents: write

jobs:
  update_summary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Qiita CLI
        run: npm install -g @qiita/qiita-cli

      # Qiitaから最新を取得（直接編集された記事を同期）
      - name: Pull latest from Qiita
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: npx qiita pull --force

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests openai

      - name: Generate AI summary article
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/generate_ai_summary.py

      - name: Publish to Qiita
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: |
          npx qiita publish 2af61d3fa992a589ec26 --force

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "生成AIによる記事まとめを自動更新

            🤖 Generated by GitHub Actions"
            git pull --rebase
            git push
          fi
