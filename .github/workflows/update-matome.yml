# まとめ記事の自動更新ワークフロー
name: Update Matome Articles

on:
  schedule:
    # 毎日の日本時間9時（UTC 0時）に実行
    - cron: '0 0 * * *'
  workflow_dispatch:  # 手動実行も可能

permissions:
  contents: write

jobs:
  update_matome:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm install -g @qiita/qiita-cli
          pip install requests

      - name: Pull latest from Qiita
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: |
          npx qiita pull --force

      - name: Fetch article stats and update matome
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: |
          python scripts/update_matome.py

      - name: Publish matome articles to Qiita
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: |
          npx qiita publish c6907e2b861cb1070f4d --force || true
          npx qiita publish 68fc3d67880d2dcb32bb --force || true
          npx qiita publish 6a39a3fc5d24780b09a0 --force || true
          npx qiita publish 51498e315d95692b243a --force || true

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "まとめ記事を自動更新

            - 新記事を追加
            - 人気マーカーを更新

            🤖 Generated by GitHub Actions"
            git pull --rebase
            git push
          fi
